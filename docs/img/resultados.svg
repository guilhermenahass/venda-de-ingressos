<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c140d"/>
      <stop offset="1" stop-color="#2b1d12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b866"/>
      <stop offset="1" stop-color="#c8913b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="330" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e2b866" font-size="15" letter-spacing="3" font-weight="600">PECKY WEST · 06 E 07/11/2026 · RESULTADO FINAL</text>
  <text x="40" y="88" fill="#f5ead8" font-size="26" font-weight="700">Um espetáculo vendido inteiro pelo sistema próprio</text>

  <g transform="translate(40,118)">
    <rect width="200" height="170" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#e2b866" stroke-opacity="0.35"/>
    <text x="20" y="64" fill="url(#gold)" font-size="50" font-weight="800">703</text>
    <text x="20" y="100" fill="#f5ead8" font-size="17" font-weight="600">ingressos emitidos</text>
    <text x="20" y="126" fill="#bfae95" font-size="14">679 vendidos + 24 cortesias</text>
    <text x="20" y="148" fill="#bfae95" font-size="14">em 222 compras</text>
  </g>

  <g transform="translate(260,118)">
    <rect width="200" height="170" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#e2b866" stroke-opacity="0.35"/>
    <text x="20" y="64" fill="url(#gold)" font-size="50" font-weight="800">491</text>
    <text x="20" y="100" fill="#f5ead8" font-size="17" font-weight="600">no dia da abertura</text>
    <text x="20" y="126" fill="#bfae95" font-size="14">sem fila, sem erro</text>
    <text x="20" y="148" fill="#bfae95" font-size="14">e sem venda em dobro</text>
  </g>

  <g transform="translate(480,118)">
    <rect width="200" height="170" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#e2b866" stroke-opacity="0.35"/>
    <text x="20" y="64" fill="url(#gold)" font-size="50" font-weight="800">92%</text>
    <text x="20" y="100" fill="#f5ead8" font-size="17" font-weight="600">entraram com QR</text>
    <text x="20" y="126" fill="#bfae95" font-size="14">644 entradas validadas</text>
    <text x="20" y="148" fill="#bfae95" font-size="14">na portaria pelo celular</text>
  </g>

  <g transform="translate(700,118)">
    <rect width="220" height="170" rx="14" fill="#e2b866" fill-opacity="0.14" stroke="#e2b866"/>
    <text x="20" y="64" fill="url(#gold)" font-size="36" font-weight="800">+R$ 10 mil</text>
    <text x="20" y="100" fill="#f5ead8" font-size="17" font-weight="600">a mais para a escola</text>
    <text x="20" y="126" fill="#bfae95" font-size="14">frente a uma plataforma</text>
    <text x="20" y="148" fill="#bfae95" font-size="14">convencional (taxa de 10%)</text>
  </g>

  <text x="40" y="314" fill="#8f7f69" font-size="12">Dados do banco de produção no fechamento das vendas. Valor aproximado; a taxa de plataformas é estimativa pública.</text>
</svg>
